
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		setUrl("https://api.modrinth.com/maven")
		content {
			includeGroup("maven.modrinth")
		}
	}
	ivy {
		setUrl("https://github.com/clickcrystals-development/ClickCrystals/releases/download")
		patternLayout {
			artifact("v[revision]/[module]-[classifier]-[revision].jar")
		}
		metadataSources {
			artifact()
		}
		content {
			includeGroup("clickcrystals-development")
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// local jar wins so unreleased ClickCrystals builds can be tested, otherwise pull the GitHub release
	def localClickCrystals = fileTree("libs") { include "ClickCrystals-*.jar" }
	if (!localClickCrystals.empty) {
		logger.lifecycle("Using local ClickCrystals jar: ${localClickCrystals.files*.name.join(", ")}")
		implementation localClickCrystals
	}
	else {
		implementation "clickcrystals-development:ClickCrystals:${project.clickcrystals_version}:${project.minecraft_version}"
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = base.archivesName.get()
			from components.java
		}
	}
	repositories {}
}